name: Test Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  test:
    uses: evanwon/browser-extension-workflows/.github/workflows/test-pr.yml@5c67ff734f69ac803e9a441b5762f99190f0f3ba # harden-release-keys branch
